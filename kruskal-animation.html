<script>
const SRC = `#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

// 边结构
struct Edge {
    int u;  // 起点
    int v;  // 终点
    int w;  // 权值

    // 按权值从小到大排序
    bool operator<(const Edge& e) const {
        return w < e.w;
    }
};

// 并查集
class UnionFind {
private:
    vector<int> parent;

public:
    // 初始化
    UnionFind(int n) {
        parent.resize(n + 1);
        for (int i = 1; i <= n; i++) {
            parent[i] = i;
        }
    }

    // 查找根节点（路径压缩）
    int Find(int x) {
        if (parent[x] != x) {
            parent[x] = Find(parent[x]);
        }
        return parent[x];
    }

    // 合并两个集合
    void Union(int x, int y) {
        int rx = Find(x);
        int ry = Find(y);

        if (rx != ry) {
            parent[rx] = ry;
        }
    }
};

// Kruskal算法
int Kruskal(int n, vector<Edge>& edges) {

    // 按边权从小到大排序
    sort(edges.begin(), edges.end());

    UnionFind uf(n);

    int mstWeight = 0;
    int edgeCount = 0;

    cout << "最小生成树的边：" << endl;

    for (Edge e : edges) {

        int u = e.u;
        int v = e.v;
        int w = e.w;

        // 判断两个顶点是否属于不同集合
        if (uf.Find(u) != uf.Find(v)) {

            // 合并两个集合
            uf.Union(u, v);

            mstWeight += w;
            edgeCount++;

            cout << u << " - "
                 << v << " : "
                 << w << endl;

            // 最小生成树有n-1条边
            if (edgeCount == n - 1) {
                break;
            }
        }
    }

    // 判断图是否连通
    if (edgeCount != n - 1) {
        cout << "图不连通，无法构成最小生成树！" << endl;
        return -1;
    }

    return mstWeight;
}

int main() {

    int n = 5;

    vector<Edge> edges = {
        {1, 2, 2},
        {2, 3, 3},
        {1, 4, 6},
        {2, 4, 8},
        {2, 5, 5},
        {3, 5, 7},
        {4, 5, 9}
    };

    int result = Kruskal(n, edges);

    if (result != -1) {
        cout << "最小生成树的总权值："
             << result << endl;
    }

    return 0;
}`.split("\n");

const EDGES = [
  { id: 0, u: 1, v: 2, w: 2 },
  { id: 1, u: 2, v: 3, w: 3 },
  { id: 2, u: 1, v: 4, w: 6 },
  { id: 3, u: 2, v: 4, w: 8 },
  { id: 4, u: 2, v: 5, w: 5 },
  { id: 5, u: 3, v: 5, w: 7 },
  { id: 6, u: 4, v: 5, w: 9 }
];
const EDGE_BY_ID = Object.fromEntries(EDGES.map((e) => [e.id, e]));
const ORDER_SORTED = [0, 1, 4, 2, 5, 3, 6];
const POS = {
  1: { x: 110, y: 82 },
  2: { x: 440, y: 54 },
  3: { x: 770, y: 82 },
  4: { x: 250, y: 286 },
  5: { x: 630, y: 286 }
};
const ROOT_COLOR = {
  1: "#2563eb",
  2: "#d97706",
  3: "#059669",
  4: "#7c3aed",
  5: "#e11d48"
};
const LABEL = {
  0: { t: 0.5, dist: 26, sign: -1 },
  1: { t: 0.5, dist: 26, sign: -1 },
  2: { t: 0.55, dist: 32, sign: 1 },
  3: { t: 0.58, dist: 34, sign: 1 },
  4: { t: 0.58, dist: 34, sign: -1 },
  5: { t: 0.55, dist: 32, sign: -1 },
  6: { t: 0.5, dist: 28, sign: 1 }
};

function rootOf(parents, x) {
  let guard = 0;
  while (parents[x] !== x && guard++ < 8) x = parents[x];
  return x;
}

function simulate() {
  const p = [0, 1, 2, 3, 4, 5];
  function find(x) {
    if (p[x] !== x) p[x] = find(p[x]);
    return p[x];
  }
  function union(x, y) {
    const rx = find(x);
    const ry = find(y);
    if (rx !== ry) p[rx] = ry;
  }
  const events = [];
  for (const [u, v] of [[1, 2], [2, 3], [2, 5], [1, 4]]) {
    find(u);
    find(v);
    events.push({ mark: "find", p: p.slice() });
    union(u, v);
    events.push({ mark: "union", p: p.slice() });
  }
  return events;
}

const STEPS = [];

function add(o) {
  if (o.parents) state.parents = o.parents.slice();
  if (o.choose != null) state.chosen = state.chosen.concat(o.choose);
  if (o.out) state.consoleLines = state.consoleLines.concat(o.out);
  if (o.sorted != null) state.sorted = o.sorted;
  if ("activeEdge" in o) state.activeEdge = o.activeEdge;
  if (o.unexamined != null) state.unexamined = o.unexamined;
  if (o.reject) state.reject = o.reject.slice();
  if (o.ufReady != null) state.ufReady = o.ufReady;
  if (o.vars) Object.assign(state.vars, o.vars);
  const active = state.activeEdge == null ? null : EDGE_BY_ID[state.activeEdge];
  STEPS.push({
    title: o.title,
    text: o.text,
    detail: o.detail || "",
    lines: o.lines || [],
    also: o.also || [],
    scrollTo: o.scrollTo || (o.lines && o.lines[0]) || 1,
    parents: state.parents.slice(),
    chosen: state.chosen.slice(),
    consoleLines: state.consoleLines.slice(),
    sorted: state.sorted,
    activeEdge: state.activeEdge,
    unexamined: state.unexamined,
    reject: state.reject.slice(),
    ufReady: state.ufReady,
    vars: { ...state.vars },
    hot: o.hot ? o.hot.slice() : (active ? [active.u, active.v] : []),
    read: o.read ? o.read.slice() : [],
    changed: o.changed ? o.changed.slice() : [],
    hypo: !!o.hypo,
    mark: o.mark || ""
  });
}

function checkTrace() {
  const problems = [];
  if (SRC.length !== 121) problems.push("源码行数是 " + SRC.length + "，预期 121");
  const expectLine = [
    [14, "return w"],
    [28, "parent[i] = i"],
    [35, "Find(parent"],
    [46, "parent[rx] = ry"],
    [55, "sort"],
    [71, "Find(u)"],
    [85, "break"],
    [96, "return mstWeight"],
    [113, "Kruskal"],
    [117, "result"]
  ];
  expectLine.forEach(([n, piece]) => {
    if (!SRC[n - 1] || SRC[n - 1].indexOf(piece) < 0) {
      problems.push("第 " + n + " 行不含「" + piece + "」");
    }
  });
  const sim = simulate();
  const marked = STEPS.filter((s) => s.mark);
  if (marked.length !== sim.length) {
    problems.push("标记步数 " + marked.length + " 与模拟事件 " + sim.length + " 不一致");
  } else {
    marked.forEach((s, i) => {
      const got = s.parents.slice(1).join(",");
      const want = sim[i].p.slice(1).join(",");
      if (s.mark !== sim[i].mark || got !== want) {
        problems.push(s.title + " 得到 parent[" + got + "]，模拟是 " + sim[i].mark + " [" + want + "]");
      }
    });
  }
  const lastReal = [...STEPS].reverse().find((s) => !s.hypo);
  const sum = lastReal.chosen.reduce((acc, id) => acc + EDGE_BY_ID[id].w, 0);
  if (sum !== 16 || lastReal.vars.mst !== "16" || lastReal.chosen.length !== 4) {
    problems.push("最小生成树权值核对失败");
  }
  return problems;
}

function colorize(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  if (/^\s*#include/.test(text)) return `<span class="pp">${esc(text)}</span>`;
  const paint = (s) => esc(s)
    .replace(/\b(int|class|struct|void|bool|return|if|for|using|namespace|private|public|const|break|operator)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
  let out = "";
  const re = /("(?:\\.|[^"\\])*")|(\/\/.*$)/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    out += paint(text.slice(last, m.index));
    out += m[1]
      ? `<span class="str">${esc(m[1])}</span>`
      : `<span class="cmt">${esc(m[2])}</span>`;
    last = m.index + m[0].length;
  }
  out += paint(text.slice(last));
  return out || " ";
}

function trimmed(u, v, r) {
  const a = POS[u], b = POS[v];
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  return {
    x1: a.x + ux * r, y1: a.y + uy * r,
    x2: b.x - ux * r, y2: b.y - uy * r,
    mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
    nx: -uy, ny: ux
  };
}

  const g = el("g", { class: "pill" });
  const rect = el("rect", { width: 26, height: 20, rx: 7 });
  const text = el("text", {});
  text.textContent = String(e.w);
  g.append(rect, text);
  pillLayer.append(g);
  edgeNodes[e.id] = line;
  pillNodes[e.id] = { g, rect, text };
  const a = POS[e.u];
  const b = POS[e.v];
  const spec = LABEL[e.id];
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const x = a.x + dx * spec.t + (-dy / len) * spec.dist * spec.sign;
  const y = a.y + dy * spec.t + (dx / len) * spec.dist * spec.sign;
  rect.setAttribute("x", x - 13);
  rect.setAttribute("y", y - 10);
  text.setAttribute("x", x);
  text.setAttribute("y", y + 0.5);
});

function edgeVisual(step, id) {
  if (step.chosen.includes(id)) return "chosen";
  if (step.activeEdge === id) return "active";
  if (step.reject.includes(id)) return "reject";
  if (step.unexamined) return "skip";
  return "idle";
}

function statusOf(step, id) {
  const ord = step.chosen.indexOf(id);
  if (ord >= 0) return { cls: "ok", text: "已选入 #" + (ord + 1) };
  if (step.activeEdge === id) return { cls: "run", text: "考察中" };
  if (step.reject.includes(id)) return { cls: "bad", text: "会成环" };
  if (step.unexamined) return { cls: "", text: "未考察" };
  if (!step.sorted) return { cls: "", text: "未排序" };
  return { cls: "", text: "待考察" };
}

  ["result", "result"]
];

function render(index) {
  const step = STEPS[index];
  document.getElementById("posLabel").textContent = (index + 1) + " / " + STEPS.length;
  document.getElementById("scrub").value = String(index);
  document.getElementById("btnPrev").disabled = index === 0;
  document.getElementById("btnNext").disabled = index === STEPS.length - 1;

  document.getElementById("exTitle").textContent = step.title;
  document.getElementById("exText").textContent = step.text;
  document.getElementById("kicker").textContent = step.hypo
    ? "对照  " + (index + 1) + " / " + STEPS.length
    : "步骤  " + (index + 1) + " / " + STEPS.length;
  document.getElementById("explain").classList.toggle("hypo", step.hypo);

  const mstBadge = document.getElementById("mstBadge");
  mstBadge.classList.toggle("done", step.vars.mst === "16");
  document.getElementById("mstNum").textContent = step.vars.mst;
  document.getElementById("cntNum").textContent = step.vars.cnt === "—" ? "—" : step.vars.cnt + " / 4";
  document.getElementById("graphHint").textContent = step.ufReady
    ? "相同颜色的顶点属于同一个集合"
    : "并查集尚未建立";

  const picked = step.chosen.map((id, i) => {
    const e = EDGE_BY_ID[id];
    return (i + 1) + ". " + e.u + "—" + e.v + "(" + e.w + ")";
  });
  document.getElementById("picked").innerHTML = picked.length
    ? "已选边：<b>" + picked.join("，") + "</b>"
    : "还没有边被选入最小生成树。";

  document.getElementById("vars").innerHTML = VAR_META.map(([key, label]) => {
    return `<div class="var"><span>${label}</span><b>${step.vars[key]}</b></div>`;
  }).join("");

  codeHost.classList.add("code");
  codeHost.classList.toggle("dim", step.lines.length + step.also.length > 0);
  codeInner.querySelectorAll(".line").forEach((row) => {
    const n = Number(row.dataset.line);
    row.classList.toggle("hi", step.lines.includes(n));
    row.classList.toggle("also", step.also.includes(n));
  });
  const row = codeInner.querySelector(`[data-line="${step.scrollTo}"]`);
  if (row) {
    const top = row.offsetTop - codeHost.clientHeight / 2 + row.clientHeight / 2;
    codeHost.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }

  EDGES.forEach((e) => {
    const vis = edgeVisual(step, e.id);
    const line = edgeNodes[e.id];
    line.setAttribute("class", "edge " + (vis === "idle" ? "" : vis));
    const geo = trimmed(e.u, e.v, 28);
    line.setAttribute("x1", geo.x1);
    line.setAttribute("y1", geo.y1);
    line.setAttribute("x2", geo.x2);
    line.setAttribute("y2", geo.y2);
    const pill = pillNodes[e.id];
    const stroke = { chosen: "#047857", active: "#ea580c", reject: "#dc2626", skip: "#cbd5e1", idle: "#94a3b8" }[vis];
    const fill = { chosen: "#a7f3d0", active: "#fed7aa", reject: "#fecaca", skip: "#f8fafc", idle: "#ffffff" }[vis];
    const ink = { chosen: "#047857", active: "#c2410c", reject: "#b91c1c", skip: "#94a3b8", idle: "#334155" }[vis];
    pill.rect.setAttribute("fill", fill);
    pill.rect.setAttribute("stroke", stroke);
    pill.text.setAttribute("fill", ink);
    if (vis === "chosen" || vis === "active") edgeLayer.append(line);
  });

  nodeLayer.querySelectorAll(".node").forEach((g) => {
    const id = Number(g.dataset.id);
    const color = step.ufReady ? ROOT_COLOR[rootOf(step.parents, id)] : "#64748b";
    g.querySelector("circle").setAttribute("fill", color);
    g.classList.toggle("hot", step.hot.includes(id));
  });

  const order = step.sorted ? ORDER_SORTED : EDGES.map((e) => e.id);
  document.getElementById("edgeHint").textContent = step.sorted
    ? "已按权值从小到大排序"
    : "调用 sort 之前保持输入顺序";
  document.getElementById("edgeBody").innerHTML = order.map((id, i) => {
    const e = EDGE_BY_ID[id];
    const st = statusOf(step, id);
    return `<tr class="${st.cls}" data-edge="${id}"><td class="numc">${i + 1}</td><td>${e.u} — ${e.v}</td><td class="numc">${e.w}</td><td><span class="tag">${st.text}</span></td></tr>`;
  }).join("");
  const uf = document.getElementById("uf");
  if (!step.ufReady) {
    uf.innerHTML = `<p style="margin:8px 0;color:#5c6b80">执行到构造函数之前，parent 数组还不存在。五个顶点各自独立，只是图上的点。</p>`;
  } else {
    const indexes = [1, 2, 3, 4, 5].map((i) => {
      return `<span class="idx" style="box-shadow:inset 0 -3px 0 ${ROOT_COLOR[i]}">${i}</span>`;
    }).join("");
    const cells = [1, 2, 3, 4, 5].map((i) => {
      const cls = [
        "cell",
        step.changed.includes(i) ? "flash" : "",
        step.read.includes(i) ? "read" : ""
      ].filter(Boolean).join(" ");
      return `<span class="${cls}">${step.parents[i]}</span>`;
    }).join("");
    const chains = [1, 2, 3, 4, 5].map((i) => {
      const seq = [i];
      let x = i, guard = 0;
      while (step.parents[x] !== x && guard++ < 8) {
        x = step.parents[x];
        seq.push(x);
      }
      return `<div class="chain">${seq.join(" → ")}</div>`;
    }).join("");
    const groups = {};
    for (let i = 1; i <= 5; i++) {
      const r = rootOf(step.parents, i);
      (groups[r] || (groups[r] = [])).push(i);
    }
    const sets = Object.values(groups)
      .sort((a, b) => a[0] - b[0])
      .map((arr) => {
        const r = rootOf(step.parents, arr[0]);
        return `<span class="set" style="background:${ROOT_COLOR[r]}">{ ${arr.join(", ")} }</span>`;
      }).join("");
    uf.innerHTML = `
      <div class="par"><span></span>${indexes}</div>
      <div class="par" style="margin-top:6px"><span class="lab">parent</span>${cells}</div>
      <div class="chains">${chains}</div>
      <div class="sets">${sets}</div>
      ${step.detail ? `<pre class="trace">${step.detail.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>` : ""}`;
  }
  if (!step.ufReady && step.detail) {
    uf.insertAdjacentHTML("beforeend", `<pre class="trace">${step.detail.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>`);
  }

  const consoleEl = document.getElementById("console");
  if (!step.consoleLines.length) {
    consoleEl.innerHTML = `<div class="muted">（尚无输出）</div>`;
  } else {
    consoleEl.innerHTML = step.consoleLines.map((line, i) => {
      const fresh = i === step.consoleLines.length - 1 ? " fresh" : "";
      return `<div class="${fresh.trim()}">${line}</div>`;
    }).join("");
  }
}

let index = 0;
let playing = false;
let timer = null;
const btnPlay = document.getElementById("btnPlay");

function pause() {
  playing = false;
  clearTimeout(timer);
  btnPlay.textContent = "播放";
}
function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  const delay = Number(document.getElementById("speed").value);
  timer = setTimeout(() => {
    if (index >= STEPS.length - 1) {
      pause();
      return;
    }
    index += 1;
    render(index);
    schedule();
  }, delay);
}
function play() {
  if (index >= STEPS.length - 1) index = 0;
  playing = true;
  btnPlay.textContent = "暂停";
  render(index);
  schedule();
}
function go(n) {
  pause();
  index = Math.max(0, Math.min(STEPS.length - 1, n));
  render(index);
}

document.getElementById("btnReset").onclick = () => go(0);
document.getElementById("btnPrev").onclick = () => go(index - 1);
document.getElementById("btnNext").onclick = () => go(index + 1);
btnPlay.onclick = () => { if (playing) pause(); else play(); };
document.getElementById("scrub").oninput = (e) => go(Number(e.target.value));
document.getElementById("speed").oninput = () => { if (playing) schedule(); };
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(index + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(index - 1); }
  else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(STEPS.length - 1); }
});

const problems = checkTrace();
if (problems.length) {
  const err = document.getElementById("err");
  err.style.display = "block";
  err.textContent = problems.join("；");
}
document.getElementById("scrub").max = String(STEPS.length - 1);
render(0);
</script>
</body>
</html>
